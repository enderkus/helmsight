[package]
name = "server"
description = "HTTP server, authentication, API and background workers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "matched-path", "original-uri"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["limit", "compression-gzip", "trace", "catch-panic"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
utoipa = "6"
utoipa-axum = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
openidconnect = { version = "4", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.14"
x509-parser = "0.18"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
percent-encoding = "2"
hex = "0.4"
base64 = "0.22"
subtle = "2"
tracing = "0.1"
zeroize = "1"
thiserror = "2"
common = { workspace = true }
collect = { workspace = true }
transport = { workspace = true }
store = { workspace = true }
alerts = { workspace = true }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[lints]
workspace = true
