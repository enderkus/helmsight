[package]
name = "alerts"
description = "Alert rule evaluation and notification delivery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }
tokio = { version = "1", features = ["time", "sync"] }
tracing = "0.1"
zeroize = "1"
common = { workspace = true }
collect = { workspace = true }
store = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
