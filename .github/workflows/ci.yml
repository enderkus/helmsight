name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          HELMSIGHT_REQUIRE_WEB: "1"

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the remote collection script
        run: |
          sed -e 's/__NONCE__/abc/' -e 's/__GROUPS__/metrics/' -e 's/__SINCE__/0/' -e 's/__OPTS__//' \
            crates/collect/src/remote.sh > /tmp/remote.sh
          shellcheck -s sh /tmp/remote.sh
          shellcheck -s sh scripts/*.sh tests/docker/alpine/entrypoint.sh

  integration:
    name: Integration (sshd containers)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Collect over SSH from six distributions
        run: cargo test -p transport --test docker --locked -- --nocapture
        env:
          HELMSIGHT_DOCKER_TESTS: "1"
          HELMSIGHT_DOCKER_DISTROS: debian ubuntu rocky fedora opensuse alpine
