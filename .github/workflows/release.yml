name: Release

# Tags publish a release. A manual run builds and tests everything but
# publishes nothing (dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  build:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: cargo install cargo-zigbuild --locked
      - name: Build static binary
        env:
          HELMSIGHT_REQUIRE_WEB: "1"
        run: cargo zigbuild --release --locked -p helmsight --target ${{ matrix.target }}
      - name: Package
        run: |
          name=helmsight-${{ matrix.target }}
          mkdir -p "pkg/$name" "image/${{ matrix.arch }}"
          cp target/${{ matrix.target }}/release/helmsight "pkg/$name/"
          cp "pkg/$name/helmsight" "image/${{ matrix.arch }}/helmsight"
          cp -r LICENSE README.md CHANGELOG.md examples docs/security.md "pkg/$name/"
          tar -C pkg -czf "$name.tar.gz" "$name"
      - name: Check the binary is static
        run: file target/${{ matrix.target }}/release/helmsight | tee /dev/stderr | grep -q "statically linked"
      - name: Smoke test
        if: matrix.arch == 'amd64'
        run: |
          bin=target/${{ matrix.target }}/release/helmsight
          "$bin" --version
          "$bin" serve --local --data-dir "$RUNNER_TEMP/hs" --listen 127.0.0.1:18080 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:18080/api/v1/meta | tee /dev/stderr | grep -q '"local_mode":true'
          curl -sf http://127.0.0.1:18080/ | grep -q '/assets/index-'
          grep -q "setup#token=" "$RUNNER_TEMP/serve.log"
          kill %1
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.arch }}
          path: |
            helmsight-${{ matrix.target }}.tar.gz
            image/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum helmsight-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md helmsight-*.tar.gz SHA256SUMS scripts/install.sh

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
      - name: Arrange binaries
        run: mkdir -p dist && cp -r image/* dist/
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
