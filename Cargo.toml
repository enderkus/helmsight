[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/helmsight"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/enderkus/helmsight"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[workspace.dependencies]
common = { path = "crates/common" }
collect = { path = "crates/collect" }
transport = { path = "crates/transport" }
store = { path = "crates/store" }
alerts = { path = "crates/alerts" }
server = { path = "crates/server" }
