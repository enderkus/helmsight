# cargo-deny configuration: licenses, advisories, bans and sources.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Marvin attack: timing side channel in RSA *private-key* operations of
  # the `rsa` crate; no fixed version exists. OIDC only verifies RS256
  # signatures (public-key operations, unaffected). SSH verifies RSA host
  # keys with public-key operations; a private RSA key is only used when an
  # administrator configures an RSA identity file, which the documentation
  # advises against (use ed25519).
  { id = "RUSTSEC-2023-0071", reason = "only RSA public-key operations in default use; see comment" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates are never published; path dependencies are fine.
allow-wildcard-paths = true
# Keep a single TLS crypto backend (ring) for portable static builds.
deny = [
  { crate = "aws-lc-rs", reason = "ring is the only crypto backend" },
  { crate = "aws-lc-sys", reason = "ring is the only crypto backend" },
  { crate = "openssl-sys", reason = "rustls only" },
  { crate = "native-tls", reason = "rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
